name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'  # Publish on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for npm trusted publishing (OIDC)
      contents: write  # Required to create the GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tags are needed to link the previous release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1 (Node 24.21.0 ships npm 11.19.0)
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Fails early if CHANGELOG.md has no section for this version
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$VERSION]" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full changelog:** %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$GITHUB_REF_NAME" >> release-notes.md
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the package
        run: npm run build

      # Authenticates with OIDC (trusted publishing), no npm token needed.
      # The version is only staged: a maintainer must approve it with 2FA on
      # npmjs.com (Staged Packages tab) or with `npm stage approve <stage-id>`.
      - name: Stage release on npm
        working-directory: dist
        run: npm stage publish

      - name: Ask for approval
        run: |
          echo "### npm release staged" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve ${GITHUB_REF_NAME} on npmjs.com (Staged Packages tab) or run \`npm stage approve <stage-id>\` to publish it." >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
